# Step 02. GUNC screens the MIMAG-filtered MAGs for chimerism, right after the
# CheckM2 assessment of step 01.
#
# Its two reference databases, ProGenomes3 and GTDB r214, are downloaded by
# scripts/utils/download_gunc_1.1_db.sh, and GUNC_DB in configs/server.env has
# to reference at the same directory afterwards.
name: GUNC_v1.1
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.9
  - gunc=1.1.0
  - diamond
  - prodigal
